[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "new-loto7"
version = "0.3.0"
description = "LOTO7 evaluation, validation and production pipeline"
requires-python = ">=3.11"

[project.scripts]
loto7-repository-audit = "loto7.repository.audit:main"
loto7-repository-inventory = "loto7.repository.inventory:main"

[project.optional-dependencies]
dev = [
  "coverage>=7.6",
  "mypy>=1.11",
  "ruff>=0.6"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
check_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true
warn_return_any = true

[tool.coverage.run]
branch = true
source = ["src/loto7/evaluation"]

[tool.coverage.report]
show_missing = true
fail_under = 65
