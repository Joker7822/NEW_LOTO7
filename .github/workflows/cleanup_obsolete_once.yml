name: Cleanup Obsolete LOTO7 Files

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.head_ref == 'agent/full-statistical-hardening-cleanup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/full-statistical-hardening-cleanup
          fetch-depth: 0
      - name: Remove confirmed obsolete files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f --ignore-unmatch \
            scripts/apply_full_statistical_hardening.py \
            .github/workflows/apply_full_statistical_hardening.yml \
            .github/workflows/cleanup_obsolete_once.yml \
            outputs/recent_era/recent_era_model_history.pre_hit_first_20260722035646.csv \
            outputs/super_recent/super_recent_model_history.pre_hit_first_20260722083852.csv \
            outputs/model_self_evolution/history.pre_hit_first_20260721231909.csv \
            outputs/holdout/holdout_result.csv \
            outputs/role_ensemble/role_ensemble_backtest.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Remove obsolete LOTO7 histories and reproducible details [skip ci]'
          git push origin HEAD:agent/full-statistical-hardening-cleanup
