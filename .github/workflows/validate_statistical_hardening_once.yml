name: Validate Statistical Hardening Once

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    if: github.head_ref == 'agent/full-statistical-hardening-cleanup'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/full-statistical-hardening-cleanup
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Compile hardened implementation
        run: python -m py_compile src/loto7/evaluation/metrics_schema.py src/loto7/evaluation/statistics.py src/loto7/evaluation/ranking.py src/loto7/evaluation/model_audit.py src/loto7/evaluation/null_permutation.py scripts/harden_generation5_summary.py scripts/run_hit_first_null_league.py scripts/run_prediction_ablation.py scripts/generation5_checkpoint_runner.py scripts/prepromotion_hardening.py scripts/promote_generation5_candidate.py tests/test_statistical_hardening.py sitecustomize.py
      - name: Run hardened regression tests
        run: python -m unittest tests.test_statistical_hardening -v
      - name: Run quality checks
        run: |
          ruff check src/loto7/evaluation/metrics_schema.py src/loto7/evaluation/statistics.py src/loto7/evaluation/ranking.py src/loto7/evaluation/model_audit.py src/loto7/evaluation/null_permutation.py scripts/harden_generation5_summary.py scripts/run_hit_first_null_league.py scripts/run_prediction_ablation.py scripts/generation5_checkpoint_runner.py scripts/prepromotion_hardening.py scripts/promote_generation5_candidate.py tests/test_statistical_hardening.py sitecustomize.py
          mypy src/loto7/evaluation/metrics_schema.py src/loto7/evaluation/statistics.py src/loto7/evaluation/ranking.py
          coverage run --source=src/loto7/evaluation -m unittest tests.test_statistical_hardening
          coverage report --fail-under=65
      - name: Remove one-shot validation workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/validate_statistical_hardening_once.yml
          git commit -m 'Complete statistical hardening validation [skip ci]'
          git push origin HEAD:agent/full-statistical-hardening-cleanup
