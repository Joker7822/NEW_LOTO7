name: LOTO7 Holdout Summary Integrity

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "outputs/holdout/holdout_result.csv"
      - "scripts/repair_holdout_summary.py"
      - "src/loto7/evaluation/hit_metrics.py"
      - "tests/test_holdout_portfolio_repair.py"
      - ".github/workflows/loto7_holdout_summary_integrity.yml"
  pull_request:
    paths:
      - "outputs/holdout/holdout_result.csv"
      - "scripts/repair_holdout_summary.py"
      - "src/loto7/evaluation/hit_metrics.py"
      - "tests/test_holdout_portfolio_repair.py"
      - ".github/workflows/loto7_holdout_summary_integrity.yml"

permissions:
  contents: write

concurrency:
  group: loto7-holdout-summary-integrity-main
  cancel-in-progress: true

jobs:
  validate-holdout-summary:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: python -m pip install -e .

      - name: Rebuild and verify complete Holdout metrics
        run: |
          set -euo pipefail
          python -m unittest tests.test_holdout_portfolio_repair -v
          python scripts/repair_holdout_summary.py \
            --detail outputs/holdout/holdout_result.csv \
            --summary outputs/holdout/holdout_summary.json \
            --recent-summary outputs/holdout/recent_era_summary.json \
            --recent-report outputs/holdout/recent_era_report.txt \
            --recent-start-year 2020 > /tmp/loto7-holdout-repair.json
          python - <<'PY'
          import json
          from pathlib import Path

          summary = json.loads(Path('outputs/holdout/holdout_summary.json').read_text(encoding='utf-8'))
          recent = summary['recent_era_summary']
          assert recent['portfolio_metrics_available'] is True
          assert recent['portfolio_metric_missing_draw_count'] == 0
          assert recent['portfolio_metric_draw_count'] == recent['target_draws']
          assert recent['average_portfolio_unique_numbers'] > 0
          assert recent['mean_ticket_pair_overlap'] > 0
          assert recent['hit_objective_score_complete'] is True
          for year, metrics in summary['year_summary'].items():
              assert metrics['portfolio_metrics_available'] is True, year
              assert metrics['portfolio_metric_missing_draw_count'] == 0, year
              assert metrics['portfolio_metric_draw_count'] == metrics['target_draws'], year
          print(json.dumps({
              'recent_target_draws': recent['target_draws'],
              'recent_portfolio_draws': recent['portfolio_metric_draw_count'],
              'average_portfolio_unique_numbers': recent['average_portfolio_unique_numbers'],
              'mean_ticket_pair_overlap': recent['mean_ticket_pair_overlap'],
              'max_ticket_pair_overlap': recent['max_ticket_pair_overlap'],
              'hit_objective_score': recent['hit_objective_score'],
          }, ensure_ascii=False, indent=2))
          PY

      - name: Upload verified Holdout summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: loto7-holdout-summary-integrity
          path: |
            outputs/holdout/holdout_summary.json
            outputs/holdout/recent_era_summary.json
            outputs/holdout/recent_era_report.txt
          if-no-files-found: error

  publish-repaired-summary:
    if: ${{ github.event_name != 'pull_request' }}
    needs:
      - validate-holdout-summary
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: python -m pip install -e .

      - name: Configure git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Rebuild Holdout summaries from latest main
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          python scripts/repair_holdout_summary.py \
            --detail outputs/holdout/holdout_result.csv \
            --summary outputs/holdout/holdout_summary.json \
            --recent-summary outputs/holdout/recent_era_summary.json \
            --recent-report outputs/holdout/recent_era_report.txt \
            --recent-start-year 2020 > /tmp/loto7-holdout-repair.json
          python - <<'PY'
          import json
          from pathlib import Path
          recent = json.loads(Path('outputs/holdout/holdout_summary.json').read_text(encoding='utf-8'))['recent_era_summary']
          assert recent['portfolio_metrics_available'] is True
          assert recent['portfolio_metric_missing_draw_count'] == 0
          assert recent['portfolio_metric_draw_count'] == recent['target_draws']
          assert recent['hit_objective_score_complete'] is True
          PY

      - name: Commit complete Holdout summaries
        run: |
          set -euo pipefail
          SNAPSHOT="$(mktemp -d)"
          mkdir -p "$SNAPSHOT/outputs/holdout"
          cp -f outputs/holdout/holdout_summary.json "$SNAPSHOT/outputs/holdout/"
          cp -f outputs/holdout/recent_era_summary.json "$SNAPSHOT/outputs/holdout/"
          cp -f outputs/holdout/recent_era_report.txt "$SNAPSHOT/outputs/holdout/"

          for ATTEMPT in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p outputs/holdout
            cp -f "$SNAPSHOT/outputs/holdout/holdout_summary.json" outputs/holdout/holdout_summary.json
            cp -f "$SNAPSHOT/outputs/holdout/recent_era_summary.json" outputs/holdout/recent_era_summary.json
            cp -f "$SNAPSHOT/outputs/holdout/recent_era_report.txt" outputs/holdout/recent_era_report.txt
            git add -f \
              outputs/holdout/holdout_summary.json \
              outputs/holdout/recent_era_summary.json \
              outputs/holdout/recent_era_report.txt
            if git diff --cached --quiet; then
              echo "Holdout summaries are already complete"
              exit 0
            fi
            git commit -m "Repair LOTO7 Holdout summary completeness [skip ci]"
            if git push origin HEAD:main; then exit 0; fi
            sleep $((ATTEMPT * 10))
          done
          exit 1
