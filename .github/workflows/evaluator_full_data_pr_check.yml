name: Evaluator Full Data PR Check

on:
  pull_request:
    branches:
      - main
    paths:
      - "pyproject.toml"
      - "src/loto7/evaluation/**"
      - "src/loto7/validation/**"
      - "holdout_evaluator.py"
      - "scripts/backtest_role_ensemble.py"
      - "scripts/check_prediction_history_results.py"
      - "scripts/evaluation_core.py"
      - "scripts/repair_holdout_summary.py"
      - "scripts/robust_model_metrics.py"
      - "scripts/update_generation4_shadow_history.py"
      - "scripts/verify_evaluator_consistency.py"
      - "scripts/verify_full_evaluator_consistency.py"
      - "scripts/check_repository_architecture.py"
      - "tests/test_evaluation_unification.py"
      - "tests/test_package_layout_and_hit_metrics.py"
      - "tests/test_holdout_portfolio_repair.py"
      - "tests/test_production_ownership.py"
      - ".github/workflows/loto7_generation4_run.yml"
      - ".github/workflows/loto7_refresh_latest_prediction.yml"
      - ".github/workflows/loto7_nested_walk_forward.yml"
      - ".github/workflows/loto7_output_layout_sync.yml"
      - ".github/workflows/loto7_validation_tests.yml"
      - ".github/workflows/evaluator_full_data_pr_check.yml"

permissions:
  contents: read

concurrency:
  group: evaluator-full-data-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package in editable mode
        run: python -m pip install -e .

      - name: Compile and run regression tests
        run: |
          set -euo pipefail
          python -m py_compile \
            src/loto7/evaluation/core.py \
            src/loto7/evaluation/hit_metrics.py \
            src/loto7/evaluation/robust.py \
            src/loto7/validation/hit_rate_gate.py \
            scripts/evaluation_core.py \
            scripts/repair_holdout_summary.py \
            scripts/robust_model_metrics.py \
            scripts/verify_evaluator_consistency.py \
            scripts/verify_full_evaluator_consistency.py \
            scripts/check_repository_architecture.py \
            holdout_evaluator.py \
            scripts/backtest_role_ensemble.py \
            scripts/check_prediction_history_results.py \
            scripts/update_generation4_shadow_history.py \
            tests/test_evaluation_unification.py \
            tests/test_package_layout_and_hit_metrics.py \
            tests/test_holdout_portfolio_repair.py \
            tests/test_production_ownership.py
          python -m unittest \
            tests.test_evaluation_unification \
            tests.test_prediction_output_consistency \
            tests.test_robust_validation_and_portfolio \
            tests.test_generation4_pipeline \
            tests.test_strict_adoption_gates \
            tests.test_package_layout_and_hit_metrics \
            tests.test_holdout_portfolio_repair \
            tests.test_production_ownership -v
          python scripts/check_repository_architecture.py \
            --json /tmp/loto7-architecture.json \
            --markdown /tmp/loto7-architecture.md

      - name: Regenerate all best-model tickets
        run: |
          set -euo pipefail
          python scripts/verify_full_evaluator_consistency.py \
            --csv loto7.csv \
            --model loto7_best_model.json \
            --holdout outputs/holdout/holdout_result.csv \
            --output outputs/role_ensemble/evaluator_consistency.json \
            --purchase-count 5 \
            --unit-cost 300 \
            --workers 8

      - name: Rebuild complete Holdout portfolio metrics
        run: |
          set -euo pipefail
          python scripts/repair_holdout_summary.py \
            --detail outputs/holdout/holdout_result.csv \
            --summary outputs/holdout/holdout_summary.json \
            --recent-summary outputs/holdout/recent_era_summary.json \
            --recent-report outputs/holdout/recent_era_report.txt \
            --recent-start-year 2020
          python - <<'PY'
          import json
          from pathlib import Path

          summary = json.loads(Path('outputs/holdout/holdout_summary.json').read_text(encoding='utf-8'))
          recent = summary['recent_era_summary']
          assert recent['portfolio_metrics_available'] is True
          assert recent['portfolio_metric_missing_draw_count'] == 0
          assert recent['average_portfolio_unique_numbers'] > 0
          assert recent['mean_ticket_pair_overlap'] > 0
          assert recent['hit_objective_score_complete'] is True
          print(json.dumps({
              'target_draws': recent['target_draws'],
              'portfolio_draws': recent['portfolio_metric_draw_count'],
              'average_unique_numbers': recent['average_portfolio_unique_numbers'],
              'mean_pair_overlap': recent['mean_ticket_pair_overlap'],
              'hit_objective_score': recent['hit_objective_score'],
          }, ensure_ascii=False, indent=2))
          PY

      - name: Clean Role backtest subset consistency
        run: |
          set -euo pipefail
          rm -f \
            /tmp/role_subset.csv \
            /tmp/role_subset_comparable.csv \
            /tmp/role_subset.json \
            /tmp/role_subset.txt \
            /tmp/role_subset_state.json \
            /tmp/holdout_subset.csv
          python scripts/backtest_role_ensemble.py \
            --csv loto7.csv \
            --best-model loto7_best_model.json \
            --holdout-start-draw 2 \
            --min-train-draws 1 \
            --purchase-count 5 \
            --overlap-limit 4 \
            --max-targets 12 \
            --output /tmp/role_subset.csv \
            --summary /tmp/role_subset.json \
            --report /tmp/role_subset.txt \
            --state /tmp/role_subset_state.json \
            --no-resume \
            --max-runtime-minutes 45 \
            --safe-exit-minutes 5
          python - <<'PY'
          import csv
          import json
          from pathlib import Path

          role_path = Path('/tmp/role_subset.csv')
          holdout_path = Path('outputs/holdout/holdout_result.csv')

          with role_path.open('r', encoding='utf-8-sig', newline='') as stream:
              reader = csv.DictReader(stream)
              role_fields = reader.fieldnames
              role_rows = list(reader)
          with holdout_path.open('r', encoding='utf-8-sig', newline='') as stream:
              reader = csv.DictReader(stream)
              holdout_fields = reader.fieldnames
              holdout_rows = list(reader)

          role_best_draws = {
              int(row['target_draw_no'])
              for row in role_rows
              if row['system'] == 'best_model'
          }
          holdout_draws = {int(row['draw_no']) for row in holdout_rows}
          comparable_draws = role_best_draws & holdout_draws
          excluded_role_draws = sorted(role_best_draws - comparable_draws)
          assert comparable_draws, 'role and holdout have no common draws'

          comparable_role_rows = [
              row for row in role_rows
              if int(row['target_draw_no']) in comparable_draws
          ]
          comparable_holdout_rows = [
              row for row in holdout_rows
              if int(row['draw_no']) in comparable_draws
          ]

          with Path('/tmp/role_subset_comparable.csv').open('w', encoding='utf-8', newline='') as stream:
              writer = csv.DictWriter(stream, fieldnames=role_fields)
              writer.writeheader()
              writer.writerows(comparable_role_rows)
          with Path('/tmp/holdout_subset.csv').open('w', encoding='utf-8', newline='') as stream:
              writer = csv.DictWriter(stream, fieldnames=holdout_fields)
              writer.writeheader()
              writer.writerows(comparable_holdout_rows)

          print(json.dumps({
              'role_draws': len(role_best_draws),
              'holdout_draws': len(holdout_draws),
              'comparable_draws': len(comparable_draws),
              'excluded_role_draws_not_yet_in_holdout': excluded_role_draws,
              'comparable_role_rows': len(comparable_role_rows),
              'comparable_holdout_rows': len(comparable_holdout_rows),
          }, ensure_ascii=False, indent=2))
          PY
          python scripts/verify_evaluator_consistency.py \
            --holdout /tmp/holdout_subset.csv \
            --role /tmp/role_subset_comparable.csv \
            --output outputs/role_ensemble/evaluator_consistency_subset.json \
            --unit-cost 300

      - name: Verify rejection-safe diagnostic refresh
        run: |
          set -euo pipefail
          cp -f outputs/generation4/shadow_history.csv /tmp/shadow_before.csv
          python scripts/check_prediction_history_results.py \
            --history outputs/evolution_prediction_history.csv \
            --csv loto7.csv \
            --output outputs/generation4/production_history_result_snapshot.txt
          python scripts/update_generation4_shadow_history.py \
            --csv loto7.csv \
            --latest-shadow outputs/generation4/latest_shadow_predictions.json \
            --history outputs/generation4/shadow_history.csv \
            --summary outputs/generation4/champion_challenger_summary.json \
            --report outputs/generation4/champion_challenger_report.txt \
            --challenger generation4 \
            --champion beam_baseline \
            --promotion-threshold 20 \
            --min-evaluated-draws 30 \
            --evaluate-only
          python - <<'PY'
          import csv
          import json
          from pathlib import Path

          def keys(path):
              with Path(path).open('r', encoding='utf-8-sig', newline='') as stream:
                  return {(row.get('prediction_draw_no', ''), row.get('strategy', '')) for row in csv.DictReader(stream)}

          before = keys('/tmp/shadow_before.csv')
          after = keys('outputs/generation4/shadow_history.csv')
          summary = json.loads(Path('outputs/generation4/champion_challenger_summary.json').read_text(encoding='utf-8'))
          assert before == after, 'evaluate-only must not append shadow predictions'
          assert summary.get('update_mode') == 'evaluate_only'
          print(json.dumps({
            'before_row_keys': len(before),
            'after_row_keys': len(after),
            'update_mode': summary.get('update_mode'),
            'evaluated_rows': summary.get('evaluated_rows'),
            'pending_rows': summary.get('pending_rows'),
          }, ensure_ascii=False, indent=2))
          PY

      - name: Validate workflow YAML and ownership ordering
        run: |
          set -euo pipefail
          ruby - <<'RUBY'
          require "yaml"
          paths = Dir[".github/workflows/*.{yml,yaml}"].sort
          raise "no workflow files" if paths.empty?
          paths.each { |path| YAML.load_file(path) }
          puts "validated #{paths.length} workflow YAML files"
          RUBY
          python - <<'PY'
          from pathlib import Path

          generation4 = Path('.github/workflows/loto7_generation4_run.yml').read_text(encoding='utf-8')
          publisher = Path('.github/workflows/loto7_refresh_latest_prediction.yml').read_text(encoding='utf-8')
          sync = Path('.github/workflows/loto7_output_layout_sync.yml').read_text(encoding='utf-8')
          nested = Path('.github/workflows/loto7_nested_walk_forward.yml').read_text(encoding='utf-8')

          assert '--prediction outputs/generation4/candidate_prediction.csv' in generation4
          assert '--prediction outputs/evolution_best_prediction.csv' not in generation4
          assert '--output outputs/evolution_prediction_history_result.txt' not in generation4
          assert 'LOTO7 Production Prediction Publisher' in publisher
          assert '- LOTO7 Generation 4 Evaluation' in publisher
          assert '--prediction outputs/evolution_best_prediction.csv' in publisher
          assert '--output outputs/evolution_prediction_history_result.txt' in publisher
          assert 'cancel-in-progress: true' in publisher
          assert '- LOTO7 Generation 4 Evaluation' in sync
          assert '- LOTO7 Production Prediction Publisher' in sync
          assert nested.index('python scripts/check_hit_rate_promotion.py') < nested.index('python scripts/promote_nested_candidate_strict.py')
          print('diagnostic evaluation, sole publisher, accuracy gate and canonical sync ordering are valid')
          PY

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluator-full-data-pr-check
          path: |
            outputs/role_ensemble/evaluator_consistency*.json
            outputs/holdout/holdout_summary.json
            outputs/holdout/recent_era_summary.json
            outputs/holdout/recent_era_report.txt
            outputs/generation4/production_history_result_snapshot.txt
            outputs/generation4/champion_challenger_summary.json
            outputs/generation4/champion_challenger_report.txt
          if-no-files-found: error
