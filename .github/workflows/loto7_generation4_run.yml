name: LOTO7 Generation 4 Evaluation

on:
  workflow_dispatch:
    inputs:
      null_simulations:
        description: "Number of null-strategy simulations"
        required: false
        default: "180"
  workflow_run:
    workflows:
      - LOTO7 Evolution Trainer
      - LOTO7 Model Self Evolution
      - LOTO7 Nested Walk Forward Validation
    types:
      - completed
  push:
    branches:
      - main
    paths:
      - ".github/workflows/loto7_generation4_run.yml"
      - "config/repository_layout.json"
      - "scripts/generation4_core.py"
      - "scripts/build_generation4_prediction.py"
      - "scripts/build_generation4_prediction_strict.py"
      - "scripts/strict_adoption_gates.py"
      - "scripts/null_strategy_league.py"
      - "scripts/evaluation_core.py"
      - "scripts/check_prediction_history_results.py"
      - "scripts/update_generation4_shadow_history.py"
      - "scripts/finalize_generation4_report.py"
      - "tests/test_generation4_pipeline.py"
      - "tests/test_strict_adoption_gates.py"
      - "tests/test_evaluation_unification.py"
      - "tests/test_production_ownership.py"

permissions:
  contents: write

concurrency:
  group: loto7-generation4-evaluation-main
  cancel-in-progress: true

jobs:
  generation4-evaluation:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Configure git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Pull latest state
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main

      - name: Prepare approved inputs and clean candidate outputs
        run: |
          set -euo pipefail
          mkdir -p outputs/generation4 outputs/recent_era outputs/super_recent outputs/role_ensemble
          rm -f \
            outputs/generation4/candidate_prediction.csv \
            outputs/generation4/candidate_prediction_report.txt \
            outputs/generation4/candidate_generation4_summary.json \
            outputs/generation4/candidate_shadow_predictions.json

          if [ ! -s outputs/recent_era/recent_era_best_model.json ]; then
            cp -f loto7_best_model.json outputs/recent_era/recent_era_best_model.json
          fi
          if [ ! -s outputs/super_recent/super_recent_best_model.json ]; then
            cp -f outputs/recent_era/recent_era_best_model.json outputs/super_recent/super_recent_best_model.json
          fi
          if [ ! -s outputs/role_ensemble/regime_strategy.json ]; then
            BASE_STRATEGY="outputs/recent_era/recent_role_strategy.json"
            if [ ! -s "$BASE_STRATEGY" ]; then BASE_STRATEGY="outputs/role_ensemble/role_strategy.json"; fi
            python scripts/detect_loto7_regime.py \
              --csv loto7.csv \
              --base-strategy "$BASE_STRATEGY" \
              --output outputs/role_ensemble/regime_state.json \
              --strategy-output outputs/role_ensemble/regime_strategy.json \
              --report outputs/role_ensemble/regime_strategy_report.txt \
              --purchase-count 5
          fi

      - name: Compile Generation 4 modules
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/generation4_core.py \
            scripts/build_generation4_prediction.py \
            scripts/build_generation4_prediction_strict.py \
            scripts/strict_adoption_gates.py \
            scripts/null_strategy_league.py \
            scripts/evaluation_core.py \
            scripts/check_prediction_history_results.py \
            scripts/update_generation4_shadow_history.py \
            scripts/finalize_generation4_report.py \
            tests/test_generation4_pipeline.py \
            tests/test_strict_adoption_gates.py \
            tests/test_evaluation_unification.py \
            tests/test_production_ownership.py

      - name: Run Generation 4 tests
        run: |
          set -euo pipefail
          python -m unittest \
            tests.test_prediction_output_consistency \
            tests.test_robust_validation_and_portfolio \
            tests.test_generation4_pipeline \
            tests.test_strict_adoption_gates \
            tests.test_evaluation_unification \
            tests.test_production_ownership -v

      - name: Resolve null simulations
        id: settings
        run: |
          VALUE="${{ inputs.null_simulations }}"
          if [ -z "$VALUE" ]; then VALUE="180"; fi
          echo "null_simulations=$VALUE" >> "$GITHUB_OUTPUT"

      - name: Run null strategy league and PBO
        run: |
          set -euo pipefail
          python scripts/null_strategy_league.py \
            --csv loto7.csv \
            --model loto7_best_model.json \
            --summary outputs/generation4/null_strategy_league_summary.json \
            --report outputs/generation4/null_strategy_league_report.txt \
            --start-year 2020 \
            --simulations "${{ steps.settings.outputs.null_simulations }}" \
            --purchase-count 5 \
            --unit-cost 300 \
            --seed "${GITHUB_RUN_ID}"

      - name: Snapshot current production results for diagnostics
        run: |
          set -euo pipefail
          python scripts/check_prediction_history_results.py \
            --history outputs/evolution_prediction_history.csv \
            --csv loto7.csv \
            --output outputs/generation4/production_history_result_snapshot.txt

          python scripts/update_generation4_shadow_history.py \
            --csv loto7.csv \
            --latest-shadow outputs/generation4/latest_shadow_predictions.json \
            --history outputs/generation4/shadow_history.csv \
            --summary outputs/generation4/champion_challenger_summary.json \
            --report outputs/generation4/champion_challenger_report.txt \
            --challenger generation4 \
            --champion beam_baseline \
            --promotion-threshold 20 \
            --min-evaluated-draws 30 \
            --evaluate-only

      - name: Build Generation 4 candidate through strict gates
        id: strict_build
        run: |
          set -uo pipefail
          set +e
          python scripts/build_generation4_prediction_strict.py \
            --require-null-league-summary \
            --strict-gate-summary outputs/generation4/strict_adoption_gate.json \
            --conformal-required-hits 4 \
            --csv loto7.csv \
            --full-model loto7_best_model.json \
            --recent-model outputs/recent_era/recent_era_best_model.json \
            --super-recent-model outputs/super_recent/super_recent_best_model.json \
            --regime-strategy outputs/role_ensemble/regime_strategy.json \
            --prediction-history outputs/evolution_prediction_history.csv \
            --shadow-history outputs/generation4/shadow_history.csv \
            --null-league-summary outputs/generation4/null_strategy_league_summary.json \
            --prediction outputs/generation4/candidate_prediction.csv \
            --prediction-report outputs/generation4/candidate_prediction_report.txt \
            --summary outputs/generation4/candidate_generation4_summary.json \
            --shadow-output outputs/generation4/candidate_shadow_predictions.json \
            --purchase-count 5 \
            --candidates-per-source 220 \
            --candidates-per-step 80 \
            --beam-width 220 \
            --max-number-usage 4 \
            --max-pair-overlap 4 \
            --history-overlap-limit 6 \
            --conformal-alpha 0.20 \
            --minimum-conformal-hits 4
          STATUS=$?
          set -e

          if [ "$STATUS" -eq 2 ]; then
            echo "adoption_allowed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Strict gates rejected the candidate. Production publication remains owned by the publisher workflow."
            exit 0
          fi
          if [ "$STATUS" -ne 0 ]; then
            echo "::error::Generation 4 strict builder failed unexpectedly with exit code $STATUS"
            exit "$STATUS"
          fi
          echo "adoption_allowed=true" >> "$GITHUB_OUTPUT"

          python scripts/enforce_prediction_constraints.py \
            --prediction outputs/generation4/candidate_prediction.csv \
            --report outputs/generation4/candidate_prediction_report.txt \
            --max-number-usage 4 \
            --max-pair-overlap 4

          python scripts/finalize_generation4_report.py \
            --prediction outputs/generation4/candidate_prediction.csv \
            --summary outputs/generation4/candidate_generation4_summary.json \
            --report outputs/generation4/candidate_prediction_report.txt

      - name: Confirm rejection is fail-closed
        if: ${{ steps.strict_build.outputs.adoption_allowed == 'false' }}
        run: |
          set -euo pipefail
          python -c 'import json; payload=json.load(open("outputs/generation4/strict_adoption_gate.json", encoding="utf-8")); assert payload.get("adoption_allowed") is False'

      - name: Update challenger diagnostics
        if: ${{ steps.strict_build.outputs.adoption_allowed == 'true' }}
        run: |
          set -euo pipefail
          python scripts/update_generation4_shadow_history.py \
            --csv loto7.csv \
            --latest-shadow outputs/generation4/candidate_shadow_predictions.json \
            --history outputs/generation4/shadow_history.csv \
            --summary outputs/generation4/champion_challenger_summary.json \
            --report outputs/generation4/champion_challenger_report.txt \
            --challenger generation4 \
            --champion beam_baseline \
            --promotion-threshold 20 \
            --min-evaluated-draws 30

      - name: Verify diagnostic outcome
        env:
          ADOPTION_ALLOWED: ${{ steps.strict_build.outputs.adoption_allowed }}
        run: |
          set -euo pipefail
          test -s outputs/generation4/null_strategy_league_summary.json
          test -s outputs/generation4/null_strategy_league_report.txt
          test -s outputs/generation4/strict_adoption_gate.json
          test -s outputs/generation4/production_history_result_snapshot.txt
          test -s outputs/generation4/shadow_history.csv
          test -s outputs/generation4/champion_challenger_summary.json
          test -s outputs/generation4/champion_challenger_report.txt
          if [ "$ADOPTION_ALLOWED" = "true" ]; then
            test -s outputs/generation4/candidate_prediction.csv
            test -s outputs/generation4/candidate_prediction_report.txt
            test -s outputs/generation4/candidate_generation4_summary.json
            test -s outputs/generation4/candidate_shadow_predictions.json
          elif [ "$ADOPTION_ALLOWED" != "false" ]; then
            echo "::error::strict_build did not publish adoption_allowed"
            exit 1
          fi

      - name: Commit diagnostic outcome only
        env:
          ADOPTION_ALLOWED: ${{ steps.strict_build.outputs.adoption_allowed }}
        run: |
          set -euo pipefail
          SNAPSHOT="$(mktemp -d)"
          mkdir -p "$SNAPSHOT/outputs/generation4"

          for FILE in \
            strict_adoption_gate.json \
            null_strategy_league_summary.json \
            null_strategy_league_report.txt \
            production_history_result_snapshot.txt \
            shadow_history.csv \
            champion_challenger_summary.json \
            champion_challenger_report.txt; do
            cp -f "outputs/generation4/$FILE" "$SNAPSHOT/outputs/generation4/$FILE"
          done

          if [ "$ADOPTION_ALLOWED" = "true" ]; then
            for FILE in \
              candidate_prediction.csv \
              candidate_prediction_report.txt \
              candidate_generation4_summary.json \
              candidate_shadow_predictions.json; do
              cp -f "outputs/generation4/$FILE" "$SNAPSHOT/outputs/generation4/$FILE"
            done
          fi

          for ATTEMPT in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p outputs/generation4
            cp -f "$SNAPSHOT/outputs/generation4/"* outputs/generation4/
            git add -f \
              outputs/generation4/strict_adoption_gate.json \
              outputs/generation4/null_strategy_league_summary.json \
              outputs/generation4/null_strategy_league_report.txt \
              outputs/generation4/production_history_result_snapshot.txt \
              outputs/generation4/shadow_history.csv \
              outputs/generation4/champion_challenger_summary.json \
              outputs/generation4/champion_challenger_report.txt
            if [ "$ADOPTION_ALLOWED" = "true" ]; then
              git add -f \
                outputs/generation4/candidate_prediction.csv \
                outputs/generation4/candidate_prediction_report.txt \
                outputs/generation4/candidate_generation4_summary.json \
                outputs/generation4/candidate_shadow_predictions.json
            fi
            if git diff --cached --quiet; then
              echo "No Generation 4 diagnostic changes"
              exit 0
            fi
            git commit -m "Update LOTO7 Generation 4 evaluation [skip ci]"
            if git push origin HEAD:main; then exit 0; fi
            sleep $((ATTEMPT * 10))
          done
          exit 1

      - name: Upload Generation 4 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: loto7-generation4-evaluation
          path: |
            outputs/generation4/strict_adoption_gate.json
            outputs/generation4/null_strategy_league_summary.json
            outputs/generation4/null_strategy_league_report.txt
            outputs/generation4/production_history_result_snapshot.txt
            outputs/generation4/shadow_history.csv
            outputs/generation4/champion_challenger_summary.json
            outputs/generation4/champion_challenger_report.txt
            outputs/generation4/candidate_*
          if-no-files-found: error
