name: Repository Structure Audit

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - "src/**"
      - "scripts/**"
      - "tests/**"
      - "config/**"
      - "docs/architecture/**"
      - "README.md"
      - "pyproject.toml"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - "src/**"
      - "scripts/**"
      - "tests/**"
      - "config/**"
      - "docs/architecture/**"
      - "README.md"
      - "pyproject.toml"

permissions:
  contents: write

concurrency:
  group: repository-structure-audit-${{ github.event_name }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install canonical package
        run: python -m pip install -e .

      - name: Compile architecture modules
        run: |
          set -euo pipefail
          python -m py_compile \
            src/loto7/repository/layout.py \
            src/loto7/repository/audit.py \
            src/loto7/repository/inventory.py \
            scripts/check_repository_architecture.py \
            scripts/audit_repository_structure.py \
            scripts/build_output_migration_backlog.py \
            tests/test_repository_architecture_v4.py \
            tests/test_output_migration_backlog.py

      - name: Run architecture regression tests
        run: |
          set -euo pipefail
          python -m unittest \
            tests.test_repository_architecture_v4 \
            tests.test_output_migration_backlog -v

      - name: Generate and enforce architecture audit
        run: |
          set -euo pipefail
          loto7-repository-audit \
            --json docs/architecture/repository_architecture_guard.json \
            --markdown docs/architecture/repository_architecture_guard.md
          loto7-repository-inventory \
            --json docs/architecture/repository_structure_audit.json \
            --markdown docs/architecture/repository_structure_audit.md
          python scripts/build_output_migration_backlog.py \
            --json docs/architecture/output_migration_backlog.json \
            --markdown docs/architecture/output_migration_backlog.md

      - name: Commit audit reports
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          set -euo pipefail
          git add \
            docs/architecture/repository_structure_audit.json \
            docs/architecture/repository_structure_audit.md \
            docs/architecture/repository_architecture_guard.json \
            docs/architecture/repository_architecture_guard.md \
            docs/architecture/output_migration_backlog.json \
            docs/architecture/output_migration_backlog.md
          if git diff --cached --quiet; then
            echo "No repository audit changes"
            exit 0
          fi
          git commit -m "Update repository structure audit [skip ci]"
          for ATTEMPT in 1 2 3; do
            if git push origin HEAD:"${GITHUB_REF_NAME}"; then exit 0; fi
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}"
            sleep $((ATTEMPT * 5))
          done
          exit 1

      - name: Upload structure audit
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: repository-structure-audit
          path: |
            docs/architecture/repository_structure_audit.json
            docs/architecture/repository_structure_audit.md
            docs/architecture/repository_architecture_guard.json
            docs/architecture/repository_architecture_guard.md
            docs/architecture/output_migration_backlog.json
            docs/architecture/output_migration_backlog.md
          if-no-files-found: error
