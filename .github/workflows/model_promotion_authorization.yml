name: LOTO7 Model Promotion Authorization

on:
  pull_request:
    branches:
      - main
    paths:
      - "loto7_model_self_evolver.py"
      - "tests/test_model_promotion_authorization.py"
      - ".github/workflows/model_promotion_authorization.yml"
  push:
    branches:
      - main
    paths:
      - "loto7_model_self_evolver.py"
      - "tests/test_model_promotion_authorization.py"
      - ".github/workflows/model_promotion_authorization.yml"

permissions:
  contents: read

concurrency:
  group: loto7-model-promotion-authorization-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify-authorization:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install -e .
      - name: Compile authorization wrapper and tests
        run: |
          set -euo pipefail
          python -m py_compile \
            loto7_model_self_evolver.py \
            tests/test_model_promotion_authorization.py
      - name: Verify fail-closed model apply authorization
        run: python -m unittest tests.test_model_promotion_authorization -v
      - name: Confirm integrated workflow cannot auto-authorize legacy apply
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/loto7_evolution.yml').read_text(encoding='utf-8')
          assert '--apply' in text
          assert 'LOTO7_ALLOW_LEGACY_DIRECT_APPLY' not in text
          wrapper = Path('loto7_model_self_evolver.py').read_text(encoding='utf-8')
          assert 'LOTO7_ALLOW_LEGACY_DIRECT_APPLY' in wrapper
          assert 'arguments = [argument for argument in arguments if argument != "--apply"]' in wrapper
          print('legacy integrated --apply is denied by the Generation 5 authorization wrapper')
          PY
